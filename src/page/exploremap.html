<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../asset/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLTMAP - Explore Map</title>
    <meta name="description"
        content="Discover reliable EV charging stations worldwide. Fast charging, real-time availability, P2P charging, and battery intelligence." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet" />

    <!-- FontAwesome Free 7 -->
    <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />

    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="../../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="../../node_modules/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../node_modules/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- AOS (Animate On Scroll) CSS -->
    <link rel="stylesheet" href="../../node_modules/aos/dist/aos.css" />

    <!-- Fancybox CSS -->
    <link rel="stylesheet" href="../../node_modules/@fancyapps/ui/dist/fancybox/fancybox.css" />

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="../../node_modules/swiper/swiper-bundle.min.css" />

    <!-- Tailwind & Application CSS -->
    <link rel="stylesheet" href="../asset/css/output.css" />
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans overflow-x-hidden">

    <!-- ==========================================
       1. FIXED HEADER & NAVBAR COMPONENT (JS)
       ========================================== -->
    <div id="navbar-app"></div>

    <!-- ==========================================
       MAIN CONTENT CONTAINER
       ========================================== -->
    <main class="flex-1 w-full pt-24 pb-8 px-4 sm:px-6 lg:px-8">

        <!-- ==========================================
         VIEW: EXPLORE MAP PAGE (#explore-view)
         ========================================== -->
        <div id="explore-view" class="min-h-screen bg-white text-slate-800 flex flex-col">

            <!-- Main Map Grid -->
            <div class="max-w-[1700px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
                <!-- Sidebar -->
                <div
                    class="lg:col-span-4 xl:col-span-4 flex flex-col gap-4 h-[700px] lg:h-[800px] xl:h-[850px] bg-white/90 backdrop-blur-md rounded-3xl p-5 border border-slate-200/80 shadow-xl shadow-slate-200/50">
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div class="relative">
                                <label for="filter-charging-speed" class="block text-[10px] uppercase tracking-wider font-extrabold text-slate-500 mb-1 flex items-center gap-1">
                                    <i class="fa-solid fa-bolt text-amber-500"></i>
                                    <span>Charging Speed</span>
                                </label>
                                <select id="filter-charging-speed"
                                    class="w-full bg-slate-100/90 border border-slate-200/90 rounded-xl py-2 px-3 pr-7 text-xs font-bold text-slate-800 focus:outline-none focus:border-[var(--secondary)] focus:bg-white focus:ring-2 focus:ring-emerald-500/20 transition cursor-pointer appearance-none">
                                    <option value="Semua">Semua Speed</option>
                                    <option value="Standard">AC Standard (7-22 kW)</option>
                                    <option value="Fast">DC Fast (50 kW)</option>
                                    <option value="Ultra-Fast">Ultra-Fast (150-350 kW)</option>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-2.5 bottom-2.5 text-slate-400 text-[10px] pointer-events-none"></i>
                            </div>

                            <div class="relative">
                                <label for="filter-connector-type" class="block text-[10px] uppercase tracking-wider font-extrabold text-slate-500 mb-1 flex items-center gap-1">
                                    <i class="fa-solid fa-plug text-sky-500"></i>
                                    <span>Connector</span>
                                </label>
                                <select id="filter-connector-type"
                                    class="w-full bg-slate-100/90 border border-slate-200/90 rounded-xl py-2 px-3 pr-7 text-xs font-bold text-slate-800 focus:outline-none focus:border-[var(--secondary)] focus:bg-white focus:ring-2 focus:ring-emerald-500/20 transition cursor-pointer appearance-none">
                                    <option value="Semua">Semua Connector</option>
                                    <option value="CCS2">CCS2</option>
                                    <option value="Type 2">Type 2</option>
                                    <option value="CHAdeMO">CHAdeMO</option>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-2.5 bottom-2.5 text-slate-400 text-[10px] pointer-events-none"></i>
                            </div>
                        </div>

                        <!-- Location & Nearby Button -->
                        <button id="btn-detect-location"
                            class="w-full py-2.5 px-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-800 hover:bg-[var(--secondary)] hover:text-white text-xs font-extrabold transition-all flex items-center justify-center gap-2 shadow-sm group cursor-pointer">
                            <i
                                class="fa-solid fa-location-crosshairs text-sm text-[var(--secondary)] group-hover:text-white transition-colors"></i>
                            <span>Gunakan Lokasi Saya • Cari Charger Terdekat</span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 no-scrollbar">
                        <div class="flex items-center gap-2">
                            <button data-bali-filter="Semua"
                                class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap bg-[var(--secondary)] text-white shadow-md shadow-emerald-500/20">Semua</button>
                            <button data-bali-filter="Public Station"
                                class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900 border border-slate-200/60">Public
                                Station</button>
                            <button data-bali-filter="Shared Home Charger"
                                class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900 border border-slate-200/60">Shared
                                Home Charger</button>
                        </div>
                        <span id="bali-filtered-count" class="text-xs text-slate-500 font-semibold shrink-0">1500
                            hasil</span>
                    </div>

                    <div id="bali-stations-list" class="flex-1 overflow-y-auto p-1.5 space-y-3 custom-scrollbar"></div>
                </div>

                <!-- Leaflet Map Container -->
                <div
                    class="lg:col-span-8 xl:col-span-8 relative z-10 isolate h-[700px] lg:h-[800px] xl:h-[850px] rounded-3xl overflow-hidden shadow-xl shadow-slate-200/50 border border-slate-200/80 bg-slate-100">
                    <div id="bali-map-container" class="w-full h-full"></div>

                    <!-- Floating Route Info Overlay Card -->
                    <div id="route-info-card"
                        class="hidden absolute top-4 left-4 right-4 sm:left-auto sm:right-4 z-[1000] max-w-sm w-full bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-2xl p-4 shadow-2xl transition-all duration-300">
                        <div class="flex items-start justify-between gap-3 mb-2.5">
                            <div class="flex items-center gap-2.5">
                                <div
                                    class="w-9 h-9 rounded-xl bg-sky-500/10 text-sky-600 flex items-center justify-center font-extrabold text-sm border border-sky-500/20 shrink-0">
                                    <i class="fa-solid fa-route"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider font-extrabold text-sky-600">Rute Terdekat Navigasi</p>
                                    <h4 id="route-target-name" class="text-xs font-extrabold text-slate-900 leading-tight">Nama Stasiun</h4>
                                </div>
                            </div>
                            <button id="btn-close-route" title="Tutup Rute"
                                class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs transition cursor-pointer">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div
                            class="flex items-center justify-between text-xs py-2 px-3 bg-slate-50 rounded-xl mb-3 border border-slate-100 font-semibold text-slate-700">
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-location-arrow text-emerald-600"></i>
                                <span id="route-distance">0.0 km</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-clock text-amber-600"></i>
                                <span id="route-duration">0 mnt</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-car text-blue-600"></i>
                                <span>Mobil / EV</span>
                            </div>
                        </div>
                        <a id="route-google-maps-btn" href="#" target="_blank" rel="noopener"
                            class="w-full py-2.5 px-3 rounded-xl bg-[var(--secondary)] hover:bg-[var(--secondary-hover)] text-white text-xs font-extrabold flex items-center justify-center gap-2 shadow-md transition">
                            <i class="fa-solid fa-diamond-turn-right"></i>
                            <span>Buka Navigasi Google Maps</span>
                        </a>
                    </div>

                    <div
                        class="absolute bottom-4 left-4 right-4 z-20 bg-white/90 backdrop-blur-md border border-slate-200/80 rounded-2xl p-3 px-5 flex items-center justify-between shadow-lg shadow-slate-200/50">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <span id="bali-visible-count" class="text-xs font-bold text-slate-800">Menampilkan stasiun
                                di Bali</span>
                        </div>
                        <span class="hidden sm:inline text-xs font-medium text-slate-500">Navigasi Peta Aktif</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- ==========================================
       FOOTER SECTION (Rendered via footer.js component)
       ========================================== -->
    <div id="footer-app"></div>

    <!-- ==========================================
       CURTAIN PAGE TRANSITION OVERLAY
       ========================================== -->
    <div id="page-curtain-overlay" class="fixed inset-0 z-[9999] pointer-events-none w-screen h-screen hidden">
        <script>
            if (sessionStorage.getItem("voltmap_transition") === "true") {
                document.getElementById("page-curtain-overlay").classList.remove("hidden");
            }
        </script>
        <div id="curtain-layer-1" class="absolute inset-0 bg-[var(--secondary)]"></div>
        <div id="curtain-layer-2"
            class="absolute inset-0 bg-[var(--background)] flex flex-col items-center justify-center">
            <div class="flex flex-col items-center justify-center animate-pulse-glow">
                <img src="../asset/img/logo.png" alt="Voltmap Logo"
                    class="h-20 w-auto object-contain drop-shadow-[0_0_25px_rgba(82,193,51,0.45)]" />
            </div>
        </div>
    </div>

    <!-- ==========================================
       LIBRARY SCRIPTS (CDN & MODULES)
       ========================================== -->
    <!-- jQuery v4.0 -->
    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>

    <!-- GSAP v3.15 + Plugins -->
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../../node_modules/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="../../node_modules/gsap/dist/ScrollToPlugin.min.js"></script>

    <!-- Leaflet & Leaflet MarkerCluster -->
    <script src="../../node_modules/leaflet/dist/leaflet.js"></script>
    <script src="../../node_modules/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- SimpleParallax.js v7.0 -->
    <script src="../../node_modules/simple-parallax-js/dist/vanilla/simpleParallaxVanilla.umd.js"></script>

    <!-- Animate On Scroll (AOS) -->
    <script src="../../node_modules/aos/dist/aos.js"></script>

    <!-- Typed.js -->
    <script src="../../node_modules/typed.js/dist/typed.umd.js"></script>

    <!-- Fancybox -->
    <script src="../../node_modules/@fancyapps/ui/dist/fancybox/fancybox.umd.js"></script>

    <!-- Swiper JS -->
    <script src="../../node_modules/swiper/swiper-bundle.min.js"></script>

    <!-- Application Module Script -->
    <script type="module" src="../asset/js/explore.js"></script>
</body>

</html>
