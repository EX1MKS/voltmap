<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../asset/img/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltMap | Create an Account</title>
  <meta name="description"
    content="Sign up for a free VoltMap account. Access the global network of EV charging stations and P2P charging features." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet" />

  <!-- FontAwesome Free 7 -->
  <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />

  <!-- Tailwind & Application CSS -->
  <link rel="stylesheet" href="../asset/css/output.css" />
</head>

<body
  class="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans selection:bg-emerald-100 selection:text-emerald-900">

  <!-- ==========================================
       HEADER & NAVIGATION BAR
       ========================================== -->
  <header class="w-full py-5 px-6 sm:px-12 bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="../asset/img/logo.png" alt="VoltMap Logo"
          class="h-9 w-9 object-contain group-hover:scale-105 transition-transform duration-300" />
        <span class="font-extrabold tracking-[4px] text-xl text-slate-900">VOLTMAP</span>
      </a>

      <!-- Back to Home Link -->
      <a href="index.html"
        class="inline-flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200/80 transition-all duration-200">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Home</span>
      </a>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT: REGISTER CARD & IMAGE SIDEBAR
       ========================================== -->
  <main class="flex-1 flex items-center justify-center py-10 md:py-16 px-4 sm:px-6 lg:px-8">
    <div
      class="w-full max-w-5xl bg-white rounded-3xl sm:rounded-[32px] border border-slate-200/90 shadow-xl shadow-slate-200/50 overflow-hidden animate-page-enter">

      <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[640px]">

        <!-- LEFT COLUMN: Image Only (Desktop Only) -->
        <div class="hidden lg:block lg:col-span-5 relative overflow-hidden bg-slate-100">
          <img src="../asset/img/images/abt5.jpg" alt="EV Charging Station Network"
            class="w-full h-full object-cover object-center" />
          <div class="absolute inset-0 bg-slate-900/10 backdrop-brightness-[0.98]"></div>
        </div>

        <!-- RIGHT COLUMN: Register Form -->
        <div class="lg:col-span-7 p-6 sm:p-10 lg:p-12 flex flex-col justify-center">

          <div class="max-w-md mx-auto w-full space-y-6">

            <!-- Form Header -->
            <div class="space-y-2 text-center sm:text-left">
              <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900">
                Create an Account
              </h1>
              <p class="text-slate-500 text-sm">
                Enter your details below to start your EV journey.
              </p>
            </div>

            <!-- Register Form -->
            <form id="register-form" class="space-y-4" action="#">

              <!-- Input Full Name -->
              <div class="space-y-1.5">
                <label for="register-name" class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">
                  Full Name
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-user text-sm"></i>
                  </div>
                  <input type="text" id="register-name" required placeholder="John Doe"
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-900 text-sm font-medium rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all duration-200" />
                </div>
              </div>

              <!-- Input Email -->
              <div class="space-y-1.5">
                <label for="register-email"
                  class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">
                  Email Address
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-envelope text-sm"></i>
                  </div>
                  <input type="email" id="register-email" required placeholder="name@example.com"
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-900 text-sm font-medium rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all duration-200" />
                </div>
              </div>

              <!-- Input Password -->
              <div class="space-y-1.5">
                <label for="register-password"
                  class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">
                  Password
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock text-sm"></i>
                  </div>
                  <input type="password" id="register-password" required placeholder="At least 6 characters"
                    class="w-full pl-10 pr-11 py-3 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-900 text-sm font-medium rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all duration-200" />

                  <!-- Toggle Visibility Button -->
                  <button type="button" data-toggle-password="register-password" aria-label="Toggle password visibility"
                    class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
                    <i class="fa-solid fa-eye text-sm"></i>
                  </button>
                </div>

                <!-- Password Strength Meter -->
                <div class="pt-1">
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="text-slate-500 text-[11px]">Password strength:</span>
                    <span id="strength-text" class="text-xs font-semibold"></span>
                  </div>
                  <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div id="strength-bar" class="h-full rounded-full transition-all duration-300 w-0 bg-slate-200">
                    </div>
                  </div>
                </div>
              </div>

              <!-- Input Confirm Password -->
              <div class="space-y-1.5">
                <label for="register-confirm-password"
                  class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">
                  Confirm Password
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-shield-cat text-sm"></i>
                  </div>
                  <input type="password" id="register-confirm-password" required placeholder="Repeat password"
                    class="w-full pl-10 pr-11 py-3 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-900 text-sm font-medium rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all duration-200" />

                  <!-- Toggle Visibility Button -->
                  <button type="button" data-toggle-password="register-confirm-password"
                    aria-label="Toggle password visibility"
                    class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
                    <i class="fa-solid fa-eye text-sm"></i>
                  </button>
                </div>
                <div id="password-match-msg"
                  class="h-5 text-xs font-semibold flex items-center gap-1 transition-all duration-200 opacity-0 pointer-events-none">
                </div>
              </div>

              <!-- Terms Checkbox -->
              <div class="flex items-start pt-1">
                <input type="checkbox" id="terms-agree" required
                  class="w-4 h-4 mt-0.5 text-emerald-600 bg-slate-100 border-slate-300 rounded focus:ring-emerald-500 focus:ring-2 cursor-pointer" />
                <label for="terms-agree"
                  class="ml-2 text-xs font-medium text-slate-600 cursor-pointer select-none leading-relaxed">
                  I agree to the <a href="#" class="text-emerald-600 font-bold hover:underline">Terms & Conditions</a>
                  and <a href="#" class="text-emerald-600 font-bold hover:underline">Privacy Policy</a> of VoltMap.
                </label>
              </div>

              <!-- Submit Button -->
              <button type="submit"
                class="w-full py-3.5 px-6 rounded-xl bg-[#52C133] hover:bg-[#16A34A] text-white font-extrabold text-sm shadow-md hover:shadow-lg hover:shadow-emerald-500/20 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer mt-2">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus text-xs"></i>
              </button>
            </form>

            <!-- Divider -->
            <div class="relative py-1">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200"></div>
              </div>
              <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-white px-3 text-slate-400 font-semibold tracking-wider">Or sign up with</span>
              </div>
            </div>

            <!-- Social SSO Buttons -->
            <div class="grid grid-cols-2 gap-3">
              <button type="button"
                class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#ffffff] hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold rounded-xl border border-slate-200 shadow-sm transition-all duration-200 cursor-pointer">
                <i class="fa-brands fa-google text-rose-500"></i>
                <span>Google</span>
              </button>
              <button type="button"
                class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#ffffff] hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold rounded-xl border border-slate-200 shadow-sm transition-all duration-200 cursor-pointer">
                <i class="fa-brands fa-apple text-slate-900 text-base"></i>
                <span>Apple</span>
              </button>
            </div>

            <!-- Login Navigation Link -->
            <p class="text-center text-xs sm:text-sm text-slate-600 pt-1 font-medium">
              Already have a VoltMap account?
              <a href="login.html"
                class="font-extrabold text-emerald-600 hover:text-emerald-700 hover:underline transition-all">
                Sign In
              </a>
            </p>

          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- ==========================================
       TOAST NOTIFICATION FLOATING
       ========================================== -->
  <div id="auth-toast"
    class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 ease-out">
    <div
      class="bg-white text-slate-900 px-5 py-3.5 rounded-2xl border border-slate-200 shadow-xl flex items-center gap-3">
      <i class="toast-icon fa-solid fa-circle-check text-emerald-500 text-lg"></i>
      <span class="toast-message text-xs sm:text-sm font-bold text-slate-800">Notification</span>
    </div>
  </div>

  <!-- ==========================================
       CURTAIN PAGE TRANSITION OVERLAY
       ========================================== -->
  <div id="page-curtain-overlay" class="fixed inset-0 z-[9999] pointer-events-none w-screen h-screen hidden">
    <script>
      if (sessionStorage.getItem("voltmap_transition") === "true") {
        document.getElementById("page-curtain-overlay").classList.remove("hidden");
      }
    </script>
    <div id="curtain-layer-1" class="absolute inset-0 bg-[var(--secondary)]"></div>
    <div id="curtain-layer-2" class="absolute inset-0 bg-[var(--background)] flex flex-col items-center justify-center">
      <div class="flex flex-col items-center justify-center animate-pulse-glow">
        <img src="../asset/img/logo.png" alt="Voltmap Logo"
          class="h-20 w-auto object-contain drop-shadow-[0_0_25px_rgba(82,193,51,0.45)]" />
      </div>
    </div>
  </div>

  <!-- Auth Script -->
  <script src="../asset/js/auth.js"></script>
</body>

</html>
